stages:
  prepare:
    cmd: python -m src.preprocess --config configs/train.yaml --write-config
    deps:
      - src/preprocess.py
      - configs/train.yaml
      - data/ml-100k/u.data
    outs:
      - data/ml-100k/processed

  train:
    cmd: python -m src.train --config configs/train.yaml
    deps:
      - src/train.py
      - src/engine.py
      - src/model.py
      - configs/train.yaml
      - data/ml-100k/processed/train.csv
    outs:
      - artifacts/model
    params:
      - train.epochs
      - train.batch_size
      - train.lr

  evaluate:
    cmd: python -m src.evaluate --config configs/train.yaml --model-dir artifacts/model
    deps:
      - src/evaluate.py
      - artifacts/model
      - configs/train.yaml
    metrics:
      - artifacts/model/metrics_eval.json
