data:
  ml100k_dir: "data/ml-100k"
  ratings_file: "data/ml-100k/u.data"
  users_file: "data/ml-100k/u.user"
  items_file: "data/ml-100k/u.item"
  sep: "\t"
  min_user_interactions: 5
  min_item_interactions: 5

seed: 42

train:
  model_type: &model_type "mf"          # "mf" | "ncf"
  epochs: 20
  batch_size: 1024
  lr: 0.001
  weight_decay: 1e-5
  device: "cuda"            # "cuda" | "cpu"
  validate_every: 1         # evaluate every N epochs
  use_amp: true            # mixed precision (torch.cuda.amp)
  num_workers: 0
  checkpoint_every: 5       # save intermediate checkpoints every N epochs
  verbose: true

model:
  type: *model_type
  embedding_dim: 64
  ncf_hidden: [128, 64]     # only used when model_type == "ncf"
  dropout: 0.2
  clamp_preds: false         # clamp predictions to [min_rating, max_rating]
  min_rating: 1.0
  max_rating: 5.0
  model_init_args:          # заполнить после препроцессинга (или автоматом)
    n_users: null
    n_items: null
    embedding_dim: 64
    ncf_hidden: [128, 64]
    dropout: 0.2

optimizer:
  name: "adam"
  params:
    betas: [0.9, 0.999]
    eps: 1e-8

scheduler:
  use: true
  type: "reduce_on_plateau"   # "reduce_on_plateau" | "step" | "none"
  params:
    mode: "min"
    factor: 0.5
    patience: 3
    min_lr: 1e-6

save:
  save_dir: "artifacts/model"
  save_config: true
  save_metrics: true
  keep_last_k: 3

metrics:
  eval_topk: 10
  compute_full_ranking: true   # if true, evaluate ranking over all items (slower, but exact)

logging:
  level: "INFO"               # DEBUG | INFO | WARNING | ERROR
  log_file: "artifacts/train.log"

evaluation:
  eval_batch_size: 1024
  full_ranking_batch: 4096    # batch size for scoring all items during evaluation

notes: |
  - После выполнения препроцессинга (src/preprocess.py) заполните:
      model.model_init_args.n_users  и model.model_init_args.n_items
    либо сделайте это автоматически в коде train.py.
  - Любые значения можно переопределить через CLI-параметры при запуске train.py.
  - Для локального тестирования на CPU поменяйте train.device на "cpu" и уменьшите batch_size.
